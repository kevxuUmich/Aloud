name: Aloud
options:
  bundleIdPrefix: design.kevxu
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.38.0
packages:
  Aloud:
    path: .
  # The same pin, and for the same reason, as the one in `Package.swift`: every
  # KeyboardShortcuts tag from 1.16.0 up carries a `#Preview` whose macro plugin ships
  # with Xcode rather than with the command line tools, so 1.15.0 is the newest tag
  # that builds here. The two pins move together or the Xcode target and `swift build`
  # resolve two different versions of the same package.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.15.0
targets:
  Aloud:
    type: application
    platform: macOS
    sources:
      - path: Sources/Aloud
      # The icon Info.plist names; a resource, so it lands in Contents/Resources.
      - path: App/Aloud.icns
        buildPhase: resources
    dependencies:
      - package: Aloud
        product: AloudUI
      - package: Aloud
        product: Prose
      - package: Aloud
        product: Vault
      - package: Aloud
        product: Speech
      - package: Aloud
        product: Kokoro
      - package: Aloud
        product: KokoroBundle
      # `Sources/Aloud` is compiled into this target directly rather than reached as a
      # product of the local package, so the app's own dependency has to be named here
      # too; without it the Xcode build cannot see `import KeyboardShortcuts`.
      - package: KeyboardShortcuts
    # The properties are stated here as well as in the file, because xcodegen writes
    # the file from this block on every generate: a bare `path` wrote an empty dict
    # over the three the sandbox needs, and the app then could not open a folder.
    entitlements:
      path: App/Aloud.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.kevxu.aloud
        PRODUCT_NAME: Aloud
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Aloud.entitlements
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
